name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          build_date="$(date -u +%Y-%m-%d)"
          commit_short="${GITHUB_SHA::7}"

          rm -rf dist-release
          mkdir -p dist-release

          for target in \
            "darwin amd64" \
            "darwin arm64" \
            "linux amd64" \
            "linux arm64" \
            "windows amd64"
          do
            read -r goos goarch <<< "$target"
            ext=""
            if [[ "$goos" == "windows" ]]; then
              ext=".exe"
            fi

            out="dist-release/mahin-${goos}-${goarch}${ext}"

            GOOS="$goos" GOARCH="$goarch" \
              go build \
                -ldflags "-X github.com/mahin/mahin-cli-v1/version.Version=${version} -X github.com/mahin/mahin-cli-v1/version.Commit=${commit_short} -X github.com/mahin/mahin-cli-v1/version.BuildDate=${build_date}" \
                -o "$out" .

            sha256sum "$out" > "${out}.sha256"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true